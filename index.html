<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>⚡ Content Market Studio</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#0a0a0a;color:#fff;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;
  -webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer;border:none;outline:none}

/* ── Layout ── */
.app{display:grid;grid-template-rows:52px 1fr 72px;height:100vh}
.main{display:flex;overflow:hidden}

/* ── Topbar ── */
.topbar{
  display:flex;align-items:center;justify-content:space-between;
  padding:0 18px;background:rgba(10,10,10,.97);
  border-bottom:1px solid rgba(255,255,255,.07);z-index:200;
}
.tb-brand{display:flex;align-items:center;gap:10px;font-size:.95rem;font-weight:700}
.tb-badge{background:rgba(255,177,98,.15);color:#FFB162;font-size:.62rem;font-weight:700;
  letter-spacing:.07em;padding:3px 9px;border-radius:20px;border:1px solid rgba(255,177,98,.25)}
.tb-actions{display:flex;align-items:center;gap:8px}
.tb-btn{padding:7px 15px;border-radius:10px;font-size:.8rem;font-weight:600;transition:all .15s}
.tb-btn-ghost{background:rgba(255,255,255,.07);color:#ccc;border:1px solid rgba(255,255,255,.1)}
.tb-btn-ghost:hover{background:rgba(255,255,255,.13);color:#fff}
.tb-btn-record{background:rgba(220,60,60,.12);color:#ff6b6b;border:1px solid rgba(220,60,60,.22);
  display:flex;align-items:center;gap:6px}
.tb-btn-record.active{background:rgba(220,60,60,.28);color:#ff4444}
.rec-dot{width:7px;height:7px;border-radius:50%;background:#ff4444;
  animation:rec-blink 1s ease-in-out infinite}
.tb-btn-record.active .rec-dot{animation-duration:.5s}
@keyframes rec-blink{0%,100%{opacity:1}50%{opacity:.25}}
.tb-btn-export{background:linear-gradient(135deg,#FFB162,#FF8C2A);color:#1a1a1a;font-weight:700;
  box-shadow:0 3px 14px rgba(255,177,98,.28);display:flex;align-items:center;gap:6px}
.tb-btn-export:hover{transform:translateY(-1px);box-shadow:0 6px 22px rgba(255,177,98,.42)}
.tb-btn-export:active{transform:scale(.97)}

/* ── Sidebar ── */
.sidebar{
  width:192px;flex-shrink:0;background:rgba(10,10,10,.95);
  border-right:1px solid rgba(255,255,255,.06);
  overflow-y:auto;padding:12px 0;
  scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.08) transparent;
}
.sb-label{font-size:.58rem;font-weight:700;color:rgba(255,255,255,.3);
  letter-spacing:.1em;text-transform:uppercase;padding:10px 14px 6px}
.preset-btn{
  width:100%;padding:5px 10px 8px;background:none;
  border:none;cursor:pointer;text-align:left;color:#fff;
  transition:background .12s;
}
.preset-btn:hover .pt{border-color:rgba(255,177,98,.35)}
.preset-btn.active .pt{border-color:#FFB162;box-shadow:0 0 0 1px rgba(255,177,98,.25)}
.pt{
  width:100%;aspect-ratio:16/9;border-radius:9px;overflow:hidden;
  border:1.5px solid rgba(255,255,255,.07);background:#111;
  display:flex;align-items:center;justify-content:center;
  transition:border-color .15s,box-shadow .15s;margin-bottom:5px;position:relative;
}
/* mini 3D phone in thumbnails */
.pt-phone{
  width:28px;height:56px;background:linear-gradient(160deg,#2a2a2a,#141414);
  border-radius:6px;box-shadow:2px 4px 12px rgba(0,0,0,.7);
  position:relative;
}
.pt-phone::before{content:'';position:absolute;top:4px;left:50%;transform:translateX(-50%);
  width:12px;height:3px;background:#000;border-radius:2px}
.pt-phone::after{content:'';position:absolute;inset:5px 2px 3px;
  background:#000;border-radius:3px}
.pt-badge{position:absolute;top:5px;right:5px;font-size:.58rem;font-weight:700;
  padding:2px 6px;border-radius:6px}
.badge-free{background:rgba(76,175,130,.25);color:#4CAF82}
.pt-meta{display:flex;justify-content:space-between;padding:0 2px}
.pt-name{font-size:.74rem;font-weight:600;color:#ddd}
.pt-dur{font-size:.67rem;color:rgba(255,255,255,.3)}

/* ── Stage ── */
.stage{flex:1;position:relative;overflow:hidden}
#bgCanvas,#threeCanvas{position:absolute;inset:0;width:100%;height:100%}
#threeCanvas{pointer-events:none}

/* Drop overlay (shown when no image) */
#dropOverlay{
  position:absolute;inset:0;z-index:50;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:10px;pointer-events:none;
  opacity:1;transition:opacity .3s;
}
#dropOverlay.hidden{opacity:0;pointer-events:none}
.drop-ring{
  width:52px;height:52px;border-radius:50%;
  border:2px dashed rgba(255,255,255,.2);
  display:flex;align-items:center;justify-content:center;
  font-size:1.4rem;color:rgba(255,255,255,.3);
  transition:all .2s;
}
.drop-text{font-size:.78rem;color:rgba(255,255,255,.3);text-align:center;line-height:1.5}
.stage.dragover #dropOverlay{opacity:1;pointer-events:auto}
.stage.dragover .drop-ring{border-color:rgba(255,177,98,.5);color:#FFB162}

/* Recording timer */
#recTimer{
  position:absolute;top:14px;left:50%;transform:translateX(-50%);z-index:100;
  background:rgba(0,0,0,.75);backdrop-filter:blur(12px);
  border:1px solid rgba(220,60,60,.3);border-radius:20px;
  padding:5px 14px;font-size:.8rem;font-weight:700;color:#ff6b6b;
  display:none;align-items:center;gap:7px;
}
#recTimer.show{display:flex}

/* ── Bottom controls ── */
.controls{
  display:flex;align-items:center;gap:10px;padding:0 18px;
  background:rgba(10,10,10,.97);border-top:1px solid rgba(255,255,255,.06);
  overflow-x:auto;scrollbar-width:none;
}
.ctrl-tabs{display:flex;gap:3px;flex-shrink:0}
.ctrl-tab{
  padding:6px 13px;border-radius:9px;font-size:.77rem;font-weight:600;
  color:rgba(255,255,255,.4);background:none;transition:all .15s;
}
.ctrl-tab.active{background:rgba(255,255,255,.09);color:#fff}
.ctrl-sep{width:1px;height:30px;background:rgba(255,255,255,.07);flex-shrink:0}
.ctrl-panels{display:flex;flex:1}
.ctrl-panel{display:none;align-items:center;gap:9px;flex:1}
.ctrl-panel.active{display:flex}
.ctrl-lbl{font-size:.7rem;color:rgba(255,255,255,.38);white-space:nowrap;flex-shrink:0}

/* Swatches */
.swatches{display:flex;gap:5px}
.swatch{
  width:26px;height:26px;border-radius:7px;cursor:pointer;flex-shrink:0;
  border:2px solid transparent;transition:all .15s;
}
.swatch:hover{transform:scale(1.12)}
.swatch.active{border-color:#FFB162;box-shadow:0 0 0 1px rgba(255,177,98,.3)}
.ph-swatch{width:22px;height:22px;border-radius:50%}

/* Sliders */
input[type=range]{
  width:90px;height:3px;-webkit-appearance:none;appearance:none;
  background:rgba(255,255,255,.1);border-radius:99px;outline:none;flex-shrink:0;
}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;width:13px;height:13px;border-radius:50%;
  background:#FFB162;border:2px solid #0a0a0a;cursor:pointer;
  box-shadow:0 2px 6px rgba(255,177,98,.4);
}

/* Toast */
.toast{
  position:fixed;bottom:90px;left:50%;transform:translateX(-50%);
  background:rgba(25,25,25,.95);border:1px solid rgba(255,255,255,.1);
  backdrop-filter:blur(20px);border-radius:11px;padding:9px 16px;
  font-size:.8rem;font-weight:600;opacity:0;transition:opacity .3s;
  pointer-events:none;z-index:999;white-space:nowrap;
}
.toast.show{opacity:1}
#fileInput{display:none}
</style>
</head>
<body>
<div class="app">

  <!-- TOPBAR -->
  <header class="topbar">
    <div class="tb-brand">
      <span>⚡</span><span>Content Market Studio</span>
      <span class="tb-badge">BETA</span>
    </div>
    <div class="tb-actions">
      <button class="tb-btn tb-btn-ghost" onclick="document.getElementById('fileInput').click()">
        ↑ Screenshot laden
      </button>
      <button class="tb-btn tb-btn-record" id="btnRecord" onclick="toggleRecord()">
        <span class="rec-dot"></span>
        <span id="btnRecLabel">Aufnehmen</span>
      </button>
      <button class="tb-btn tb-btn-export" onclick="exportPNG()">
        ↓ Export PNG
      </button>
    </div>
  </header>

  <div class="main">

    <!-- SIDEBAR -->
    <aside class="sidebar">
      <div class="sb-label">Animationen</div>
      <div id="presetList"></div>
    </aside>

    <!-- STAGE -->
    <main class="stage" id="stage">
      <canvas id="bgCanvas"></canvas>
      <canvas id="threeCanvas"></canvas>

      <div id="dropOverlay">
        <div class="drop-ring">+</div>
        <div class="drop-text">App Screenshot<br>hier droppen</div>
      </div>

      <div class="rec-timer" id="recTimer">
        <span class="rec-dot"></span>
        <span id="recTime">0:00</span>
      </div>
    </main>

  </div>

  <!-- BOTTOM CONTROLS -->
  <div class="controls">
    <div class="ctrl-tabs">
      <button class="ctrl-tab active" onclick="switchCtrl('scene',this)">🎨 Szene</button>
      <button class="ctrl-tab" onclick="switchCtrl('device',this)">📱 Device</button>
      <button class="ctrl-tab" onclick="switchCtrl('light',this)">💡 Licht</button>
    </div>
    <div class="ctrl-sep"></div>
    <div class="ctrl-panels">

      <div class="ctrl-panel active" id="panel-scene">
        <span class="ctrl-lbl">Hintergrund</span>
        <div class="swatches" id="bgSwatches"></div>
        <div class="ctrl-sep" style="margin:0 4px"></div>
        <span class="ctrl-lbl">Bokeh Intensität</span>
        <input type="range" min="0" max="100" value="70" oninput="bk.intensity=this.value/100">
        <span class="ctrl-lbl" style="margin-left:6px">Partikel</span>
        <input type="range" min="10" max="100" value="55" oninput="bk.count=+this.value">
      </div>

      <div class="ctrl-panel" id="panel-device">
        <span class="ctrl-lbl">Farbe</span>
        <div class="swatches" id="phoneSwatches"></div>
        <div class="ctrl-sep" style="margin:0 6px"></div>
        <span class="ctrl-lbl">Größe</span>
        <input type="range" min="55" max="130" value="100" oninput="phoneScale=this.value/100;phoneGroup.scale.setScalar(phoneScale)">
        <span class="ctrl-lbl" style="margin-left:6px">Extra Y-Dreh</span>
        <input type="range" min="-60" max="60" value="0" oninput="extraY=THREE.MathUtils.degToRad(+this.value)">
      </div>

      <div class="ctrl-panel" id="panel-light">
        <span class="ctrl-lbl">Key Intensität</span>
        <input type="range" min="0" max="30" value="12" step=".5" oninput="keyLight.intensity=this.value">
        <span class="ctrl-lbl" style="margin-left:6px">Bokeh Blur</span>
        <input type="range" min="0" max="50" value="14" oninput="bk.blur=+this.value">
        <span class="ctrl-lbl" style="margin-left:6px">Bokeh Größe</span>
        <input type="range" min="20" max="220" value="90" oninput="bk.maxR=+this.value">
        <span class="ctrl-lbl" style="margin-left:6px">Speed</span>
        <input type="range" min="1" max="20" value="5" oninput="bk.speed=this.value/10">
      </div>

    </div>
  </div>
</div>

<input type="file" id="fileInput" accept="image/*"/>
<div class="toast" id="toast"></div>

<!-- ═══════════════════════════════════════════════
     SCRIPT
     ═══════════════════════════════════════════════ -->
<script>
'use strict';

/* ══════════════════════════════════════
   PRESETS & THEMES
   ══════════════════════════════════════ */
const PRESETS = [
  { id:'float',     name:'Float',     dur:'3.2s', free:true  },
  { id:'tilt',      name:'Tilt',      dur:'4.0s', free:false },
  { id:'orbit',     name:'Orbit',     dur:'6.0s', free:false },
  { id:'rise',      name:'Rise',      dur:'1.6s', free:true  },
  { id:'pulse',     name:'Pulse',     dur:'2.2s', free:false },
  { id:'showcase',  name:'Showcase',  dur:'8.0s', free:false },
];

const BG_THEMES = [
  { name:'Gold',    stops:['#7a4e00','#3d2400','#120b00'], colors:['255,177,98','210,130,50','255,220,140'] },
  { name:'Navy',    stops:['#1B2632','#0d1520','#04090f'], colors:['100,155,210','255,177,98','76,175,130'] },
  { name:'Midnight',stops:['#1a1030','#0d0820','#050308'], colors:['120,80,220','200,80,180','80,120,255'] },
  { name:'Sunset',  stops:['#4a1028','#220814','#0a0306'], colors:['255,100,80','255,170,60','200,60,100'] },
  { name:'Forest',  stops:['#0a2018','#04100c','#020805'], colors:['60,180,100','100,220,140','40,130,80'] },
];

const PHONE_COLORS = [
  { name:'Titan Natural', hex:0x1e1e1e, spec:0x666666, frame:0x3a3a3a },
  { name:'Titan Black',   hex:0x0d0d0d, spec:0x3a3a3a, frame:0x222222 },
  { name:'Titan White',   hex:0xc8c8c4, spec:0x999999, frame:0xaaaaaa },
  { name:'Deep Blue',     hex:0x0f1a28, spec:0x3a5a7a, frame:0x243a52 },
];

/* ══════════════════════════════════════
   STATE
   ══════════════════════════════════════ */
let currentPreset = 'float';
let currentBgIdx  = 0;
let phoneScale    = 1.0;
let extraY        = 0;
let uploadedDataUrl = null;
let riseStart     = null;
let animTime      = 0; // manual clock reset on preset change

const bk = { intensity:.7, count:55, maxR:90, blur:14, speed:.5 };

/* ══════════════════════════════════════
   BOKEH BACKGROUND CANVAS
   ══════════════════════════════════════ */
const bgCanvas = document.getElementById('bgCanvas');
const bgCtx    = bgCanvas.getContext('2d');
let bkParticles = [];

function resizeBg() {
  bgCanvas.width  = bgCanvas.offsetWidth;
  bgCanvas.height = bgCanvas.offsetHeight;
  rebuildParticles();
}

function rebuildParticles() {
  bkParticles = Array.from({ length:120 }, (_, i) => ({
    x:     Math.random() * bgCanvas.width,
    y:     Math.random() * bgCanvas.height,
    r:     Math.random() * bk.maxR + 12,
    vx:   (Math.random() - .5) * .5,
    vy:   (Math.random() - .5) * .5,
    phase: Math.random() * Math.PI * 2,
    ci:    i % 3,
  }));
}

function drawBg(t) {
  const w = bgCanvas.width, h = bgCanvas.height;
  const theme = BG_THEMES[currentBgIdx];

  bgCtx.clearRect(0, 0, w, h);

  // Radial gradient base
  const g = bgCtx.createRadialGradient(w*.38, h*.3, 0, w*.5, h*.5, Math.max(w,h)*.9);
  g.addColorStop(0,   theme.stops[0]);
  g.addColorStop(.5,  theme.stops[1]);
  g.addColorStop(1,   theme.stops[2]);
  bgCtx.fillStyle = g;
  bgCtx.fillRect(0, 0, w, h);

  // Bokeh
  const vis = Math.round(bk.count);
  bgCtx.save();
  if (bk.blur > 0) bgCtx.filter = `blur(${bk.blur}px)`;

  for (let i = 0; i < Math.min(vis, bkParticles.length); i++) {
    const p = bkParticles[i];
    p.x += p.vx * bk.speed;
    p.y += p.vy * bk.speed;
    if (p.x < -220) p.x = w + 220;
    if (p.x > w+220) p.x = -220;
    if (p.y < -220) p.y = h + 220;
    if (p.y > h+220) p.y = -220;

    const a  = (.12 + .22 * (Math.sin(t*.0007 + p.phase)*.5+.5)) * bk.intensity;
    const r  = (bk.maxR > 0 ? p.r * bk.maxR / 90 : 20) * (1 + .1*Math.sin(t*.0004+p.phase));
    const rgb = theme.colors[p.ci];
    const cg = bgCtx.createRadialGradient(p.x, p.y, 0, p.x, p.y, r);
    cg.addColorStop(0, `rgba(${rgb},${a.toFixed(3)})`);
    cg.addColorStop(1, `rgba(${rgb},0)`);
    bgCtx.beginPath();
    bgCtx.arc(p.x, p.y, r, 0, Math.PI*2);
    bgCtx.fillStyle = cg;
    bgCtx.fill();
  }
  bgCtx.restore();
}

new ResizeObserver(resizeBg).observe(bgCanvas);
resizeBg();

/* ══════════════════════════════════════
   THREE.JS  ——  PHONE SETUP
   ══════════════════════════════════════ */
const threeCanvas = document.getElementById('threeCanvas');
const renderer    = new THREE.WebGLRenderer({ canvas: threeCanvas, antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.physicallyCorrectLights = true;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type    = THREE.PCFSoftShadowMap;

const scene  = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(28, 1, 1, 5000);
camera.position.z = 700;

/* ── Geometry helpers ── */
function roundedRectShape(w, h, r) {
  const s = new THREE.Shape();
  s.moveTo(-w/2 + r, -h/2);
  s.lineTo( w/2 - r, -h/2);
  s.quadraticCurveTo( w/2, -h/2,  w/2, -h/2 + r);
  s.lineTo( w/2,  h/2 - r);
  s.quadraticCurveTo( w/2,  h/2,  w/2 - r,  h/2);
  s.lineTo(-w/2 + r,  h/2);
  s.quadraticCurveTo(-w/2,  h/2, -w/2,  h/2 - r);
  s.lineTo(-w/2, -h/2 + r);
  s.quadraticCurveTo(-w/2, -h/2, -w/2 + r, -h/2);
  return s;
}

function extrudeShape(shape, depth) {
  return new THREE.ExtrudeGeometry(shape, { depth, bevelEnabled: false });
}

function flatShape(shape) {
  return new THREE.ShapeGeometry(shape);
}

/* ── Phone dimensions ── */
const PW = 216, PH = 452, PD = 9, PR = 44;
const SW = PW - 14, SH = PH - 14, SR = PR - 7;

/* ── Phone group ── */
const phoneGroup = new THREE.Group();
scene.add(phoneGroup);

/* Body */
const bodyGeo = extrudeShape(roundedRectShape(PW, PH, PR), PD);
bodyGeo.translate(0, 0, -PD/2);

let bodyMat = new THREE.MeshPhongMaterial({
  color: 0x1e1e1e, specular: 0x666666, shininess: 120, side: THREE.DoubleSide
});
const bodyMesh = new THREE.Mesh(bodyGeo, bodyMat);
bodyMesh.receiveShadow = true;
bodyMesh.castShadow    = true;
phoneGroup.add(bodyMesh);

/* Screen bezel (inset dark glass) */
const bezelGeo = flatShape(roundedRectShape(SW, SH, SR));
const bezelMat = new THREE.MeshPhongMaterial({ color: 0x000000, specular: 0x111111, shininess: 200 });
const bezelMesh = new THREE.Mesh(bezelGeo, bezelMat);
bezelMesh.position.z = PD/2 + 0.1;
phoneGroup.add(bezelMesh);

/* Screen image plane */
const screenGeo = flatShape(roundedRectShape(SW - 2, SH - 2, SR - 1));
let screenMat   = new THREE.MeshBasicMaterial({ color: 0x080808 });
const screenMesh = new THREE.Mesh(screenGeo, screenMat);
screenMesh.position.z = PD/2 + 0.4;
phoneGroup.add(screenMesh);

/* Dynamic Island */
const islandGeo = flatShape(roundedRectShape(82, 26, 14));
const islandMat = new THREE.MeshBasicMaterial({ color: 0x000000 });
const islandMesh = new THREE.Mesh(islandGeo, islandMat);
islandMesh.position.set(0, SH/2 - 20, PD/2 + 0.5);
phoneGroup.add(islandMesh);

/* Home indicator bar */
const homeGeo = new THREE.PlaneGeometry(88, 4);
const homeMat = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: .28 });
const homeMesh = new THREE.Mesh(homeGeo, homeMat);
homeMesh.position.set(0, -SH/2 + 10, PD/2 + 0.5);
phoneGroup.add(homeMesh);

/* Side buttons */
function makeButton(w, h, d, x, y, z) {
  const g = new THREE.BoxGeometry(w, h, d);
  const m = new THREE.MeshPhongMaterial({ color: 0x252525, specular: 0x444444, shininess: 90 });
  const mesh = new THREE.Mesh(g, m);
  mesh.position.set(x, y, z);
  phoneGroup.add(mesh);
  return mesh;
}
makeButton(4, 32, 6, -PW/2 - 2, PH/4 - 10, 0); // vol up
makeButton(4, 28, 6, -PW/2 - 2, PH/4 - 52, 0); // vol dn
makeButton(4, 52, 6,  PW/2 + 2, PH/4 - 30, 0); // power

/* ── Screen reflection (subtle) ── */
const reflGeo = flatShape(roundedRectShape(SW-2, SH-2, SR-1));
const reflMat = new THREE.MeshBasicMaterial({
  color: 0xffffff, transparent: true, opacity: .035,
  side: THREE.FrontSide,
});
const reflMesh = new THREE.Mesh(reflGeo, reflMat);
reflMesh.position.z = PD/2 + 0.8;
phoneGroup.add(reflMesh);

/* ── Lights ── */
scene.add(new THREE.AmbientLight(0xffffff, 0.38));

let keyLight = new THREE.DirectionalLight(0xfff8f0, 12);
keyLight.position.set(3, 4, 5);
keyLight.castShadow = true;
scene.add(keyLight);

const fillLight = new THREE.DirectionalLight(0xaabbff, 3);
fillLight.position.set(-4, -2, 3);
scene.add(fillLight);

const rimLight = new THREE.DirectionalLight(0xFFB162, 4);
rimLight.position.set(0, -5, -4);
scene.add(rimLight);

/* ── Resize ── */
function resizeThree() {
  const w = threeCanvas.offsetWidth, h = threeCanvas.offsetHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
new ResizeObserver(resizeThree).observe(threeCanvas);
resizeThree();

/* ══════════════════════════════════════
   ANIMATION LOGIC
   ══════════════════════════════════════ */
function applyPresetAnim(t) {
  const g = phoneGroup;
  switch (currentPreset) {

    case 'float':
      g.position.y  =  Math.sin(t * 1.15) * 18;
      g.rotation.x  =  Math.sin(t * 0.75) * 0.055;
      g.rotation.y  =  Math.sin(t * 0.55) * 0.09 + extraY;
      g.rotation.z  =  Math.sin(t * 0.4)  * 0.018;
      break;

    case 'tilt':
      g.position.y  =  Math.sin(t * 0.7) * 10;
      g.rotation.y  =  Math.sin(t * 0.9) * 0.65 + extraY;
      g.rotation.x  =  Math.sin(t * 0.6) * 0.09;
      g.rotation.z  =  0;
      break;

    case 'orbit':
      g.rotation.y  = t * 0.7 + extraY;
      g.rotation.x  = 0.18;
      g.rotation.z  = 0;
      g.position.y  = 0;
      break;

    case 'rise': {
      if (riseStart === null) riseStart = t;
      const prog  = Math.min((t - riseStart) / 1.6, 1);
      const ease  = 1 - Math.pow(1 - prog, 3);
      g.position.y = (1 - ease) * -110;
      g.rotation.x = (1 - ease) *  0.25 + extraY * .2;
      g.rotation.y = extraY;
      g.rotation.z = 0;
      break;
    }

    case 'pulse':
      const s       = 1 + Math.sin(t * 1.8) * 0.042;
      g.scale.setScalar(s * phoneScale);
      g.rotation.y  = Math.sin(t * 1.8) * 0.08 + extraY;
      g.rotation.x  = Math.sin(t * 1.2) * 0.04;
      g.rotation.z  = 0;
      g.position.y  = 0;
      break;

    case 'showcase':
      // slow orbit with tilt — shows all sides
      g.rotation.y  = t * 0.28 + extraY;
      g.rotation.x  = 0.22 + Math.sin(t * 0.4) * 0.08;
      g.rotation.z  = Math.sin(t * 0.3) * 0.04;
      g.position.y  = Math.sin(t * 0.5) * 8;
      break;
  }

  // Don't override scale in pulse case — done inline
  if (currentPreset !== 'pulse') {
    g.scale.setScalar(phoneScale);
  }
}

/* ══════════════════════════════════════
   MAIN LOOP
   ══════════════════════════════════════ */
let loopStart = null;

function loop(ts) {
  requestAnimationFrame(loop);
  if (!loopStart) loopStart = ts;
  const t = (ts - loopStart) * .001;

  drawBg(ts);
  applyPresetAnim(t);
  renderer.render(scene, camera);

  // Recording composite
  if (isRecording && recCtx) {
    recCtx.clearRect(0, 0, recCanvas.width, recCanvas.height);
    recCtx.drawImage(bgCanvas,    0, 0, recCanvas.width, recCanvas.height);
    recCtx.drawImage(threeCanvas, 0, 0, recCanvas.width, recCanvas.height);
  }
}
requestAnimationFrame(loop);

/* ══════════════════════════════════════
   IMAGE UPLOAD → TEXTURE
   ══════════════════════════════════════ */
let screenTexture = null;

function loadUserImage(file) {
  if (!file || !file.type.startsWith('image/')) return;
  const reader = new FileReader();
  reader.onload = e => {
    uploadedDataUrl = e.target.result;
    const img = new Image();
    img.onload = () => {
      if (screenTexture) screenTexture.dispose();
      screenTexture = new THREE.Texture(img);
      screenTexture.needsUpdate = true;
      screenMat.dispose();
      screenMat = new THREE.MeshBasicMaterial({ map: screenTexture });
      screenMesh.material = screenMat;
      document.getElementById('dropOverlay').classList.add('hidden');
      showToast('✓ Screenshot geladen');
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

document.getElementById('fileInput').addEventListener('change', e => loadUserImage(e.target.files[0]));

const stage = document.getElementById('stage');
stage.addEventListener('dragover', e => { e.preventDefault(); stage.classList.add('dragover'); });
stage.addEventListener('dragleave', () => stage.classList.remove('dragover'));
stage.addEventListener('drop', e => {
  e.preventDefault(); stage.classList.remove('dragover');
  loadUserImage(e.dataTransfer.files[0]);
});

/* ══════════════════════════════════════
   EXPORT PNG
   ══════════════════════════════════════ */
async function exportPNG() {
  showToast('🎨 Rendering…');
  // Force render
  renderer.render(scene, camera);
  await new Promise(r => setTimeout(r, 80));

  const w = bgCanvas.width, h = bgCanvas.height;
  const out = document.createElement('canvas');
  out.width = w * 2; out.height = h * 2;
  const oc = out.getContext('2d');
  oc.scale(2, 2);
  oc.drawImage(bgCanvas,    0, 0, w, h);
  oc.drawImage(threeCanvas, 0, 0, w, h);

  const a = document.createElement('a');
  a.download = 'content-market-promo.png';
  a.href = out.toDataURL('image/png');
  a.click();
  showToast('✓ PNG gespeichert!');
}

/* ══════════════════════════════════════
   VIDEO RECORDING
   ══════════════════════════════════════ */
let isRecording = false, mediaRecorder, recChunks, recStart, recInterval;
let recCanvas, recCtx;

function toggleRecord() {
  if (isRecording) stopRecord(); else startRecord();
}

function startRecord() {
  isRecording = true;
  const w = bgCanvas.width, h = bgCanvas.height;
  recCanvas = document.createElement('canvas');
  recCanvas.width = w; recCanvas.height = h;
  recCtx = recCanvas.getContext('2d');

  const mime = MediaRecorder.isTypeSupported('video/webm;codecs=vp9')
             ? 'video/webm;codecs=vp9' : 'video/webm';
  mediaRecorder = new MediaRecorder(recCanvas.captureStream(30),
    { mimeType: mime, videoBitsPerSecond: 10_000_000 });
  recChunks = [];
  mediaRecorder.ondataavailable = e => { if (e.data.size > 0) recChunks.push(e.data); };
  mediaRecorder.onstop = saveVideo;
  mediaRecorder.start(100);

  recStart   = Date.now();
  recInterval = setInterval(() => {
    const s = Math.floor((Date.now() - recStart) / 1000);
    document.getElementById('recTime').textContent =
      Math.floor(s/60) + ':' + String(s%60).padStart(2,'0');
  }, 200);

  document.getElementById('btnRecord').classList.add('active');
  document.getElementById('btnRecLabel').textContent = 'Stop';
  document.getElementById('recTimer').classList.add('show');
  showToast('● Aufnahme läuft…');
}

function stopRecord() {
  isRecording = false;
  clearInterval(recInterval);
  mediaRecorder.stop();
  document.getElementById('btnRecord').classList.remove('active');
  document.getElementById('btnRecLabel').textContent = 'Aufnehmen';
  document.getElementById('recTimer').classList.remove('show');
  showToast('⏳ Video wird exportiert…');
}

function saveVideo() {
  const blob = new Blob(recChunks, { type: 'video/webm' });
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement('a');
  a.href = url; a.download = 'content-market-promo.webm'; a.click();
  setTimeout(() => URL.revokeObjectURL(url), 5000);
  showToast('✓ Video gespeichert!');
}

/* ══════════════════════════════════════
   TOAST
   ══════════════════════════════════════ */
let toastTimer;
function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2800);
}
</script>
