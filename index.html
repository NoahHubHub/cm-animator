<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>⚡ Content Market Studio</title>
<style>
/* ══════════════════════════════════════════
   RESET & BASE
   ══════════════════════════════════════════ */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#0a0a0a;color:#fff;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;
  -webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer;border:none;outline:none}
input{font-family:inherit}

/* ══════════════════════════════════════════
   LAYOUT
   ══════════════════════════════════════════ */
.app{display:grid;grid-template-rows:52px 1fr 80px;height:100vh;overflow:hidden}

/* ── Topbar ── */
.topbar{
  display:flex;align-items:center;justify-content:space-between;
  padding:0 18px;
  background:rgba(15,15,15,.95);
  border-bottom:1px solid rgba(255,255,255,.08);
  backdrop-filter:blur(20px);z-index:200;
}
.tb-brand{
  display:flex;align-items:center;gap:10px;font-size:.95rem;font-weight:700;
}
.tb-badge{
  background:rgba(255,177,98,.15);color:#FFB162;font-size:.62rem;font-weight:700;
  letter-spacing:.07em;padding:3px 9px;border-radius:20px;
  border:1px solid rgba(255,177,98,.25);
}
.tb-actions{display:flex;align-items:center;gap:8px}
.tb-btn{
  padding:7px 15px;border-radius:10px;font-size:.8rem;font-weight:600;
  transition:all .15s;
}
.tb-btn-ghost{
  background:rgba(255,255,255,.07);color:#ccc;
  border:1px solid rgba(255,255,255,.1);
}
.tb-btn-ghost:hover{background:rgba(255,255,255,.12);color:#fff}
.tb-btn-record{
  background:rgba(220,60,60,.15);color:#ff6b6b;
  border:1px solid rgba(220,60,60,.25);
  display:flex;align-items:center;gap:6px;
}
.tb-btn-record.active{background:rgba(220,60,60,.3);color:#ff4444}
.tb-btn-record .dot{
  width:7px;height:7px;border-radius:50%;background:#ff4444;
  animation:rec-blink 1s ease-in-out infinite;
}
.tb-btn-record.active .dot{animation:rec-blink .6s ease-in-out infinite}
@keyframes rec-blink{0%,100%{opacity:1}50%{opacity:.3}}
.tb-btn-export{
  background:linear-gradient(135deg,#FFB162,#FF8C2A);color:#1a1a1a;
  font-weight:700;box-shadow:0 3px 14px rgba(255,177,98,.3);
  display:flex;align-items:center;gap:6px;
}
.tb-btn-export:hover{transform:translateY(-1px);box-shadow:0 6px 20px rgba(255,177,98,.4)}
.tb-btn-export:active{transform:scale(.97)}

/* ── Main area ── */
.main{display:flex;overflow:hidden}

/* ── Sidebar ── */
.sidebar{
  width:200px;flex-shrink:0;
  background:rgba(12,12,12,.9);
  border-right:1px solid rgba(255,255,255,.07);
  overflow-y:auto;padding:14px 0;
  scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.1) transparent;
}
.sb-section{
  font-size:.6rem;font-weight:700;color:rgba(255,255,255,.35);
  letter-spacing:.1em;text-transform:uppercase;
  padding:10px 14px 7px;
}
.preset-item{
  display:flex;flex-direction:column;gap:0;
  padding:4px 10px;cursor:pointer;
  transition:background .12s;border:none;
  background:none;color:#fff;width:100%;text-align:left;
}
.preset-item:hover .preset-thumb{border-color:rgba(255,177,98,.4)}
.preset-item.active .preset-thumb{border-color:#FFB162;box-shadow:0 0 0 1px rgba(255,177,98,.3)}
.preset-thumb{
  width:100%;aspect-ratio:16/9;border-radius:10px;overflow:hidden;
  border:2px solid rgba(255,255,255,.08);
  background:#1a1a1a;position:relative;
  transition:border-color .15s,box-shadow .15s;
  display:flex;align-items:center;justify-content:center;
  margin-bottom:5px;
}
.preset-thumb-inner{
  width:34px;height:68px;background:#222;border-radius:8px;
  position:relative;transition:all .3s;box-shadow:0 4px 12px rgba(0,0,0,.5);
}
.preset-thumb-inner::before{
  content:'';position:absolute;top:5px;left:50%;transform:translateX(-50%);
  width:16px;height:5px;background:#000;border-radius:3px;
}
.preset-thumb-inner::after{
  content:'';position:absolute;inset:8px 2px 2px;
  background:linear-gradient(135deg,rgba(255,177,98,.2),rgba(163,81,57,.2));
  border-radius:5px;
}
.preset-badge{
  position:absolute;top:5px;right:5px;
  font-size:.6rem;font-weight:700;padding:2px 6px;border-radius:8px;
}
.badge-free{background:rgba(76,175,130,.25);color:#4CAF82}
.preset-meta{display:flex;justify-content:space-between;align-items:center;padding:0 2px}
.preset-name{font-size:.75rem;font-weight:600;color:#e0e0e0}
.preset-dur{font-size:.68rem;color:rgba(255,255,255,.35)}

/* ── Stage ── */
.stage{
  flex:1;position:relative;overflow:hidden;
  display:flex;align-items:center;justify-content:center;
}
#bgCanvas{position:absolute;inset:0;width:100%;height:100%}

.phone-scene{
  position:relative;z-index:10;
  perspective:1200px;perspective-origin:50% 40%;
}
.phone-wrapper{
  transform-style:preserve-3d;
  will-change:transform;
}
.phone-body{
  width:232px;height:478px;
  background:linear-gradient(160deg,#2a2a2a 0%,#1a1a1a 100%);
  border-radius:50px;position:relative;
  box-shadow:
    0 0 0 1.5px #3d3d3d,
    0 0 0 3px #1a1a1a,
    0 0 0 4px #3a3a3a,
    0 40px 100px rgba(0,0,0,.7),
    0 0 60px rgba(0,0,0,.4),
    inset 0 1px 0 rgba(255,255,255,.12);
  transform-style:preserve-3d;
}
/* Titanium frame sheen */
.phone-body::before{
  content:'';position:absolute;inset:-4px;border-radius:53px;
  background:linear-gradient(135deg,
    rgba(255,255,255,.15) 0%,
    transparent 30%,
    transparent 70%,
    rgba(255,255,255,.08) 100%);
  pointer-events:none;z-index:20;
}
/* Screen glass reflection */
.phone-body::after{
  content:'';position:absolute;inset:10px;border-radius:42px;
  background:linear-gradient(135deg,
    rgba(255,255,255,.06) 0%,
    transparent 40%);
  pointer-events:none;z-index:30;
}

/* Dynamic Island */
.phone-island{
  position:absolute;top:14px;left:50%;transform:translateX(-50%);
  width:90px;height:28px;background:#000;border-radius:20px;z-index:25;
  box-shadow:0 0 0 1px rgba(255,255,255,.05);
}
/* Screen */
.phone-screen{
  position:absolute;inset:10px;border-radius:42px;
  overflow:hidden;background:#000;z-index:5;
  display:flex;align-items:center;justify-content:center;
}
.phone-screen img{
  width:100%;height:100%;object-fit:cover;display:none;
}
/* Drop zone */
.drop-zone{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:8px;cursor:pointer;padding:20px;text-align:center;
  width:100%;height:100%;
  transition:background .2s;border-radius:42px;
}
.drop-zone:hover,.drop-zone.dragover{background:rgba(255,177,98,.06)}
.drop-icon{
  width:42px;height:42px;border-radius:50%;
  border:2px dashed rgba(255,255,255,.2);
  display:flex;align-items:center;justify-content:center;
  font-size:1.2rem;color:rgba(255,255,255,.35);
  transition:all .2s;
}
.drop-zone:hover .drop-icon,.drop-zone.dragover .drop-icon{
  border-color:rgba(255,177,98,.5);color:#FFB162;
}
.drop-label{font-size:.72rem;color:rgba(255,255,255,.3);line-height:1.4}

/* Side buttons */
.phone-btn{position:absolute;background:#2e2e2e;border-radius:2px}
.phone-btn-vol-up{width:3px;height:30px;left:-4px;top:110px}
.phone-btn-vol-dn{width:3px;height:30px;left:-4px;top:150px}
.phone-btn-power{width:3px;height:50px;right:-4px;top:130px}
/* Bottom bar */
.phone-home{
  position:absolute;bottom:8px;left:50%;transform:translateX(-50%);
  width:100px;height:4px;background:rgba(255,255,255,.25);border-radius:3px;z-index:25;
}

/* ══ Animations ══════════════════════════ */
.anim-float .phone-wrapper{animation:anim-float 3.2s ease-in-out infinite}
@keyframes anim-float{
  0%,100%{transform:translateY(0) rotateX(2deg) rotateY(-4deg)}
  50%    {transform:translateY(-22px) rotateX(-1deg) rotateY(4deg)}
}

.anim-tilt .phone-wrapper{animation:anim-tilt 4s ease-in-out infinite}
@keyframes anim-tilt{
  0%,100%{transform:rotateY(-32deg) rotateX(6deg) translateY(0)}
  50%    {transform:rotateY(32deg) rotateX(-6deg) translateY(-10px)}
}

.anim-orbit .phone-wrapper{animation:anim-orbit 6s linear infinite}
@keyframes anim-orbit{
  0%  {transform:rotateY(0deg) rotateX(10deg)}
  100%{transform:rotateY(360deg) rotateX(10deg)}
}

.anim-rise .phone-wrapper{animation:anim-rise 1.6s cubic-bezier(.22,1,.36,1) forwards}
@keyframes anim-rise{
  0%  {transform:translateY(60px) rotateX(-8deg);opacity:0}
  100%{transform:translateY(0) rotateX(0deg);opacity:1}
}

.anim-pulse .phone-wrapper{animation:anim-pulse 2.2s ease-in-out infinite}
@keyframes anim-pulse{
  0%,100%{transform:scale(1) rotateY(0)}
  50%    {transform:scale(1.06) rotateY(6deg)}
}

.anim-spotlight .phone-wrapper{animation:anim-spotlight 5s ease-in-out infinite}
@keyframes anim-spotlight{
  0%,100%{transform:rotateY(-8deg) rotateX(4deg)}
  33%    {transform:rotateY(0deg) rotateX(0deg) scale(1.04)}
  66%    {transform:rotateY(8deg) rotateX(-4deg)}
}

/* ── Bottom controls ── */
.controls{
  display:flex;align-items:center;gap:12px;
  padding:0 20px;
  background:rgba(12,12,12,.95);
  border-top:1px solid rgba(255,255,255,.07);
  overflow-x:auto;
}
.ctrl-tabs{display:flex;gap:4px;flex-shrink:0}
.ctrl-tab{
  padding:7px 14px;border-radius:10px;font-size:.78rem;font-weight:600;
  color:rgba(255,255,255,.45);background:none;
  transition:all .15s;
}
.ctrl-tab.active{background:rgba(255,255,255,.1);color:#fff}
.ctrl-sep{width:1px;height:32px;background:rgba(255,255,255,.08);flex-shrink:0}

/* Scene controls */
.ctrl-panels{display:flex;gap:0;flex:1}
.ctrl-panel{display:none;align-items:center;gap:10px;flex:1}
.ctrl-panel.active{display:flex}

/* Background swatches */
.bg-swatches{display:flex;gap:6px;align-items:center}
.bg-swatch{
  width:30px;height:30px;border-radius:8px;cursor:pointer;flex-shrink:0;
  border:2px solid transparent;transition:all .15s;
}
.bg-swatch:hover{transform:scale(1.1)}
.bg-swatch.active{border-color:#FFB162;box-shadow:0 0 0 1px rgba(255,177,98,.3)}

/* Phone color swatches */
.phone-swatches{display:flex;gap:6px;align-items:center}
.ph-swatch{
  width:24px;height:24px;border-radius:50%;cursor:pointer;flex-shrink:0;
  border:2px solid transparent;transition:all .15s;
}
.ph-swatch.active{border-color:#FFB162}

/* Intensity slider */
.ctrl-label{font-size:.72rem;color:rgba(255,255,255,.4);white-space:nowrap;flex-shrink:0}
input[type=range]{
  width:100px;height:3px;-webkit-appearance:none;appearance:none;
  background:rgba(255,255,255,.12);border-radius:99px;outline:none;flex-shrink:0;
}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;width:14px;height:14px;border-radius:50%;
  background:#FFB162;border:2px solid #1a1a1a;
  box-shadow:0 2px 6px rgba(255,177,98,.4);cursor:pointer;
}

/* Recording overlay */
.rec-timer{
  position:absolute;top:14px;left:50%;transform:translateX(-50%);
  background:rgba(0,0,0,.7);backdrop-filter:blur(10px);
  border:1px solid rgba(220,60,60,.3);border-radius:20px;
  padding:5px 14px;font-size:.8rem;font-weight:700;color:#ff6b6b;
  display:none;z-index:100;align-items:center;gap:6px;
}
.rec-timer.show{display:flex}
.rec-timer .dot{width:7px;height:7px;border-radius:50%;background:#ff4444;animation:rec-blink .6s ease-in-out infinite}

/* Toast */
.toast{
  position:fixed;bottom:100px;left:50%;transform:translateX(-50%);
  background:rgba(30,30,30,.95);border:1px solid rgba(255,255,255,.1);
  backdrop-filter:blur(20px);border-radius:12px;padding:10px 18px;
  font-size:.82rem;font-weight:600;color:#fff;
  opacity:0;transition:opacity .3s;pointer-events:none;z-index:999;
  white-space:nowrap;
}
.toast.show{opacity:1}

/* File input hidden */
#fileInput{display:none}
</style>
</head>
<body>
<div class="app">

  <!-- ═══ TOPBAR ════════════════════════════════════ -->
  <header class="topbar">
    <div class="tb-brand">
      <span>⚡</span>
      <span>Content Market Studio</span>
      <span class="tb-badge">BETA</span>
    </div>
    <div class="tb-actions">
      <button class="tb-btn tb-btn-ghost" id="btnUpload" onclick="document.getElementById('fileInput').click()">
        ↑ Screenshot laden
      </button>
      <button class="tb-btn tb-btn-record" id="btnRecord" onclick="toggleRecord()">
        <span class="dot"></span>
        <span id="btnRecordLabel">Aufnehmen</span>
      </button>
      <button class="tb-btn tb-btn-export" onclick="exportPNG()">
        ↓ Export PNG
      </button>
    </div>
  </header>

  <!-- ═══ MAIN ══════════════════════════════════════ -->
  <div class="main">

    <!-- Sidebar: presets -->
    <aside class="sidebar">
      <div class="sb-section">Animationen</div>
      <div id="presetList"></div>
    </aside>

    <!-- Stage: canvas bg + phone -->
    <main class="stage" id="stage">
      <canvas id="bgCanvas"></canvas>

      <div class="rec-timer" id="recTimer">
        <span class="dot"></span>
        <span id="recTime">0:00</span>
      </div>

      <div class="phone-scene" id="phoneScene">
        <div class="phone-wrapper" id="phoneWrapper">
          <div class="phone-body">
            <div class="phone-island"></div>
            <!-- Screen -->
            <div class="phone-screen" id="phoneScreen">
              <img id="userImg" alt=""/>
              <div class="drop-zone" id="dropZone">
                <div class="drop-icon">+</div>
                <div class="drop-label">Screenshot<br>hier droppen</div>
              </div>
            </div>
            <!-- Buttons -->
            <div class="phone-btn phone-btn-vol-up"></div>
            <div class="phone-btn phone-btn-vol-dn"></div>
            <div class="phone-btn phone-btn-power"></div>
            <!-- Home bar -->
            <div class="phone-home"></div>
          </div>
        </div>
      </div>

    </main>
  </div>

  <!-- ═══ BOTTOM CONTROLS ═══════════════════════════ -->
  <div class="controls">
    <div class="ctrl-tabs">
      <button class="ctrl-tab active" onclick="switchCtrl('scene',this)">🎨 Szene</button>
      <button class="ctrl-tab" onclick="switchCtrl('device',this)">📱 Device</button>
      <button class="ctrl-tab" onclick="switchCtrl('light',this)">✨ Licht</button>
    </div>
    <div class="ctrl-sep"></div>

    <div class="ctrl-panels">

      <!-- Scene panel -->
      <div class="ctrl-panel active" id="panel-scene">
        <span class="ctrl-label">Hintergrund</span>
        <div class="bg-swatches" id="bgSwatches"></div>
        <div class="ctrl-sep" style="margin:0 4px"></div>
        <span class="ctrl-label">Intensität</span>
        <input type="range" id="bokehIntensity" min="0" max="100" value="70"
          oninput="bokehConfig.intensity=this.value/100">
        <span class="ctrl-label" style="margin-left:8px">Partikel</span>
        <input type="range" id="bokehCount" min="0" max="100" value="50"
          oninput="bokehConfig.count=Math.round(this.value)">
      </div>

      <!-- Device panel -->
      <div class="ctrl-panel" id="panel-device">
        <span class="ctrl-label">Farbe</span>
        <div class="phone-swatches" id="phoneSwatches"></div>
        <div class="ctrl-sep" style="margin:0 8px"></div>
        <span class="ctrl-label">Größe</span>
        <input type="range" id="phoneScale" min="60" max="130" value="100"
          oninput="document.getElementById('phoneScene').style.transform='scale('+this.value/100+')'">
        <span class="ctrl-label" style="margin-left:8px">Neigung</span>
        <input type="range" id="phoneTilt" min="-60" max="60" value="0"
          oninput="extraTilt=this.value">
      </div>

      <!-- Light panel -->
      <div class="ctrl-panel" id="panel-light">
        <span class="ctrl-label">Bokeh Größe</span>
        <input type="range" id="bokehSize" min="20" max="200" value="80"
          oninput="bokehConfig.maxR=this.value">
        <span class="ctrl-label" style="margin-left:8px">Schärfe</span>
        <input type="range" id="bokehBlur" min="0" max="40" value="12"
          oninput="bokehConfig.blur=this.value">
        <span class="ctrl-label" style="margin-left:8px">Geschwindigkeit</span>
        <input type="range" id="bokehSpeed" min="1" max="20" value="6"
          oninput="bokehConfig.speed=this.value/10">
      </div>

    </div>
  </div>
</div>

<input type="file" id="fileInput" accept="image/*"/>
<div class="toast" id="toast"></div>

<script>
/* ════════════════════════════════════════════════════
   PRESETS
   ════════════════════════════════════════════════════ */
const PRESETS = [
  { id:'float',     name:'Float',     dur:'3.2s', free:true  },
  { id:'tilt',      name:'Tilt',      dur:'4.0s', free:false },
  { id:'orbit',     name:'Orbit',     dur:'6.0s', free:false },
  { id:'rise',      name:'Rise',      dur:'1.6s', free:true  },
  { id:'pulse',     name:'Pulse',     dur:'2.2s', free:false },
  { id:'spotlight', name:'Spotlight', dur:'5.0s', free:false },
];

const PHONE_COLORS = [
  { name:'Titan Natur', body:'linear-gradient(160deg,#2a2a2a,#1a1a1a)', frame:'#3d3d3d' },
  { name:'Titan Schwarz',body:'linear-gradient(160deg,#111,#0a0a0a)',   frame:'#2a2a2a' },
  { name:'Titan Weiß',  body:'linear-gradient(160deg,#ddd,#c0c0c0)',    frame:'#b0b0b0' },
  { name:'Titan Blau',  body:'linear-gradient(160deg,#1a2a3a,#0f1a2a)', frame:'#2a3a4a' },
];

const BG_THEMES = [
  {
    name:'Gold Bokeh',
    bg:'radial-gradient(ellipse 80% 60% at 40% 30%,#8B5A00 0%,#5a3300 40%,#2a1a00 70%,#0f0a00 100%)',
    colors:['rgba(255,177,98,VAL)','rgba(200,120,40,VAL)','rgba(255,220,120,VAL)'],
  },
  {
    name:'Navy Deep',
    bg:'radial-gradient(ellipse 80% 60% at 30% 40%,#1B2632 0%,#0f1922 50%,#060d14 100%)',
    colors:['rgba(100,160,220,VAL)','rgba(255,177,98,VAL)','rgba(76,175,130,VAL)'],
  },
  {
    name:'Midnight',
    bg:'radial-gradient(ellipse 70% 50% at 50% 50%,#1a1a2e 0%,#0d0d1a 60%,#050508 100%)',
    colors:['rgba(120,80,220,VAL)','rgba(200,80,180,VAL)','rgba(80,120,255,VAL)'],
  },
  {
    name:'Sunset',
    bg:'radial-gradient(ellipse 80% 60% at 60% 40%,#4a1028 0%,#2a0a18 50%,#0f0508 100%)',
    colors:['rgba(255,100,80,VAL)','rgba(255,160,60,VAL)','rgba(200,60,100,VAL)'],
  },
  {
    name:'Forest',
    bg:'radial-gradient(ellipse 70% 55% at 40% 50%,#0a2010 0%,#051208 60%,#020804 100%)',
    colors:['rgba(60,180,100,VAL)','rgba(100,220,140,VAL)','rgba(40,120,80,VAL)'],
  },
];

/* ════════════════════════════════════════════════════
   STATE
   ════════════════════════════════════════════════════ */
let currentPreset   = 'float';
let currentBgIdx    = 0;
let currentPhoneIdx = 0;
let uploadedImage   = null;
let extraTilt       = 0;

const bokehConfig = {
  intensity: .7,
  count:     50,
  maxR:      80,
  blur:      12,
  speed:     .6,
};

/* ════════════════════════════════════════════════════
   BUILD PRESETS SIDEBAR
   ════════════════════════════════════════════════════ */
const presetList = document.getElementById('presetList');
PRESETS.forEach(p => {
  const el = document.createElement('button');
  el.className = 'preset-item' + (p.id === currentPreset ? ' active' : '');
  el.dataset.id = p.id;

  // Mini animated thumbnail
  const animCSS = p.id === 'float'     ? 'animation:thumb-float 3s ease-in-out infinite'
                : p.id === 'tilt'      ? 'animation:thumb-tilt 3s ease-in-out infinite'
                : p.id === 'orbit'     ? 'animation:thumb-orbit 4s linear infinite'
                : p.id === 'rise'      ? 'animation:thumb-rise 1.5s cubic-bezier(.22,1,.36,1) forwards'
                : p.id === 'pulse'     ? 'animation:thumb-pulse 2s ease-in-out infinite'
                :                        'animation:thumb-spot 4s ease-in-out infinite';

  el.innerHTML = `
    <div class="preset-thumb">
      <div style="perspective:200px;perspective-origin:50% 50%;">
        <div class="preset-thumb-inner" style="${animCSS}"></div>
      </div>
      ${p.free ? '<div class="preset-badge badge-free">FREE</div>' : ''}
    </div>
    <div class="preset-meta">
      <span class="preset-name">${p.name}</span>
      <span class="preset-dur">${p.dur}</span>
    </div>`;

  el.addEventListener('click', () => selectPreset(p.id, el));
  presetList.appendChild(el);
});

/* Thumbnail keyframes */
const thumbStyle = document.createElement('style');
thumbStyle.textContent = `

/* ════════════════════════════════════════════════════
   SELECT PRESET
   ════════════════════════════════════════════════════ */
function selectPreset(id, btn) {

// Init
document.getElementById('phoneWrapper').classList.add('anim-' + currentPreset);

/* ════════════════════════════════════════════════════
   BACKGROUND SWATCHES
   ════════════════════════════════════════════════════ */
const bgSwatches = document.getElementById('bgSwatches');
BG_THEMES.forEach((t, i) => {
  const el = document.createElement('div');
  el.className = 'bg-swatch' + (i === 0 ? ' active' : '');
  el.title = t.name;
  el.style.background = t.bg;
  el.addEventListener('click', () => {
    document.querySelectorAll('.bg-swatch').forEach(s => s.classList.remove('active'));
    el.classList.add('active');
    currentBgIdx = i;
    rebuildBokeh();

  bgSwatches.appendChild(el);
});

/* ════════════════════════════════════════════════════
   PHONE COLOR SWATCHES
   ════════════════════════════════════════════════════ */
const phoneSwatches = document.getElementById('phoneSwatches');
PHONE_COLORS.forEach((c, i) => {
  const el = document.createElement('div');
  el.className = 'ph-swatch' + (i === 0 ? ' active' : '');
  el.title = c.name;
  el.style.background = c.body;
  el.style.border = '2px solid ' + c.frame;
  el.addEventListener('click', () => {

    body.style.setProperty('box-shadow',
      `0 0 0 1.5px ${c.frame}, 0 0 0 3px #1a1a1a, 0 0 0 4px ${c.frame},
       0 40px 100px rgba(0,0,0,.7), 0 0 60px rgba(0,0,0,.4),
       inset 0 1px 0 rgba(255,255,255,.12)`);
  });
  phoneSwatches.appendChild(el);
});

/* ════════════════════════════════════════════════════
   BOKEH CANVAS
   ════════════════════════════════════════════════════ */
const canvas = document.getElementById('bgCanvas');
const ctx    = canvas.getContext('2d');

let bokehParticles = [];

function rebuildBokeh() {
  const theme = BG_THEMES[currentBgIdx];
  bokehParticles = Array.from({ length: 80 }, (_, i) => ({
    x:    Math.random() * canvas.width,
    y:    Math.random() * canvas.height,
    r:    Math.random() * bokehConfig.maxR + 10,
    vx:  (Math.random() - .5) * .3,
    vy:  (Math.random() - .5) * .3,
    phase: Math.random() * Math.PI * 2,
    colorIdx: i % theme.colors.length,
  }));
}

function resize() {
  canvas.width  = canvas.offsetWidth;
  canvas.height = canvas.offsetHeight;
  rebuildBokeh();
}
new ResizeObserver(resize).observe(canvas);
resize();

function drawBg() {
  const theme = BG_THEMES[currentBgIdx];
  const w = canvas.width, h = canvas.height;

  // Background gradient
  ctx.clearRect(0, 0, w, h);
  const grad = ctx.createRadialGradient(w*.4, h*.35, 0, w*.5, h*.5, Math.max(w,h)*.8);
  // Parse theme bg roughly — use canvas gradient instead
  const stops = currentBgIdx === 0 ? [['#6b4400',0],['#3d2000',.45],['#1a0d00',.75],['#080400',1]]
              : currentBgIdx === 1 ? [['#1B2632',0],['#0f1a28',.5],['#050c14',1]]
              : currentBgIdx === 2 ? [['#1a1a2e',0],['#0d0d1a',.6],['#050508',1]]
              : currentBgIdx === 3 ? [['#4a1028',0],['#2a0a18',.5],['#0f0508',1]]
              :                      [['#0a2010',0],['#051208',.6],['#020804',1]];
  stops.forEach(([c,o]) => grad.addColorStop(o, c));
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, w, h);

  // Bokeh
  const t    = Date.now() * .001;
  const vis  = Math.round(bokehConfig.count * .8 + 10);
  const blur = parseFloat(bokehConfig.blur);
  ctx.save();
  if (blur > 0) { ctx.filter = `blur(${blur}px)`; }

  for (let i = 0; i < Math.min(vis, bokehParticles.length); i++) {
    const p = bokehParticles[i];
    p.x += p.vx * bokehConfig.speed;
    p.y += p.vy * bokehConfig.speed;
    if (p.x < -200) p.x = w + 200;
    if (p.x > w + 200) p.x = -200;
    if (p.y < -200) p.y = h + 200;
    if (p.y > h + 200) p.y = -200;

    const alpha = (.15 + .25 * (Math.sin(t * .6 + p.phase) * .5 + .5)) * bokehConfig.intensity;
    const r     = p.r * (1 + .12 * Math.sin(t * .4 + p.phase));
    const colTemplate = BG_THEMES[currentBgIdx].colors[p.colorIdx];
    const col   = colTemplate.replace('VAL', alpha.toFixed(3));

    const g2 = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, r);
    g2.addColorStop(0, col);
    g2.addColorStop(1, col.replace(/[\d.]+\)$/, '0)'));
    ctx.beginPath();
    ctx.arc(p.x, p.y, r, 0, Math.PI * 2);
    ctx.fillStyle = g2;
    ctx.fill();
  }
  ctx.restore();
}

/* ════════════════════════════════════════════════════
   ANIMATION LOOP
   ════════════════════════════════════════════════════ */
function loop() {
  drawBg();
  requestAnimationFrame(loop);
}
loop();

/* ════════════════════════════════════════════════════
   IMAGE UPLOAD
   ════════════════════════════════════════════════════ */
const dropZone  = document.getElementById('dropZone');
const userImg   = document.getElementById('userImg');
const fileInput = document.getElementById('fileInput');

function loadImage(file) {
  if (!file || !file.type.startsWith('image/')) return;
  const reader = new FileReader();
  reader.onload = e => {
    userImg.src = e.target.result;
    userImg.style.display = 'block';
    dropZone.style.display = 'none';
    uploadedImage = e.target.result;
    toast('✓ Screenshot geladen');
  };
  reader.readAsDataURL(file);
}

fileInput.addEventListener('change', e => loadImage(e.target.files[0]));

dropZone.addEventListener('click', () => fileInput.click());
dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('dragover'); });
dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
dropZone.addEventListener('drop', e => {
  e.preventDefault();
  dropZone.classList.remove('dragover');
  loadImage(e.dataTransfer.files[0]);
});

// Also allow drop anywhere on stage
const stage = document.getElementById('stage');
stage.addEventListener('dragover', e => e.preventDefault());
stage.addEventListener('drop', e => {
  e.preventDefault();
  loadImage(e.dataTransfer.files[0]);
});

/* ════════════════════════════════════════════════════
   BOTTOM CONTROLS SWITCH
   ════════════════════════════════════════════════════ */
function switchCtrl(id, btn) {
  document.querySelectorAll('.ctrl-tab').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.ctrl-panel').forEach(p => p.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('panel-' + id).classList.add('active');
}

/* ════════════════════════════════════════════════════
   EXPORT PNG  (no external lib — canvas composite)
   ════════════════════════════════════════════════════ */
async function exportPNG() {
  toast('🎨 Rendering…');
  try {
    // Use html2canvas if available, else fallback canvas render
    const el = document.getElementById('stage');
    const rect = el.getBoundingClientRect();
    const scale = 2;

    const offCanvas = document.createElement('canvas');
    offCanvas.width  = rect.width  * scale;
    offCanvas.height = rect.height * scale;
    const offCtx = offCanvas.getContext('2d');
    offCtx.scale(scale, scale);

    // 1. Draw background from main canvas
    offCtx.drawImage(canvas, 0, 0, rect.width, rect.height);

    // 2. Draw phone mockup (simplified)
    const phoneEl   = document.querySelector('.phone-body');
    const phoneRect = phoneEl.getBoundingClientRect();
    const px = phoneRect.left - rect.left;
    const py = phoneRect.top  - rect.top;
    const pw = phoneRect.width;
    const ph = phoneRect.height;

    // Phone body
    offCtx.save();
    roundRect(offCtx, px, py, pw, ph, 44);
    offCtx.fillStyle = '#1a1a1a';
    offCtx.fill();
    offCtx.restore();

    // Screen
    offCtx.save();
    roundRect(offCtx, px+9, py+9, pw-18, ph-18, 36);
    offCtx.fillStyle = '#000';
    offCtx.fill();
    if (uploadedImage) {
      const img = new Image();
      await new Promise(res => { img.onload = res; img.src = uploadedImage; });
      offCtx.save();
      roundRect(offCtx, px+9, py+9, pw-18, ph-18, 36);
      offCtx.clip();
      offCtx.drawImage(img, px+9, py+9, pw-18, ph-18);
      offCtx.restore();
    }
    offCtx.restore();

    // Dynamic island
    offCtx.save();
    offCtx.fillStyle = '#000';
    offCtx.beginPath();
    const islandX = px + pw/2 - 40, islandY = py + 13;
    offCtx.roundRect(islandX, islandY, 80, 24, 13);
    offCtx.fill();
    offCtx.restore();

    // Download
    const link = document.createElement('a');
    link.download = 'content-market-promo.png';
    link.href = offCanvas.toDataURL('image/png');
    link.click();
    toast('✓ PNG gespeichert!');
  } catch(e) {
    toast('Export-Fehler: ' + e.message);
  }
}

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.roundRect(x, y, w, h, r);
}

/* ════════════════════════════════════════════════════
   VIDEO RECORDING  (MediaRecorder on bgCanvas + phone overlay)
   ════════════════════════════════════════════════════ */
let isRecording = false;
let mediaRecorder, recChunks, recStart, recInterval;
let recCanvas, recCtx;

async function toggleRecord() {
  if (isRecording) stopRecord();
  else             startRecord();
}

async function startRecord() {
  isRecording = true;

  // Composite canvas for recording
  const stage   = document.getElementById('stage');
  const stRect  = stage.getBoundingClientRect();

  recCanvas = document.createElement('canvas');
  recCanvas.width  = stRect.width;
  recCanvas.height = stRect.height;
  recCtx   = recCanvas.getContext('2d');

  const stream  = recCanvas.captureStream(30);
  const mimeType = MediaRecorder.isTypeSupported('video/webm;codecs=vp9')
                 ? 'video/webm;codecs=vp9' : 'video/webm';
  mediaRecorder = new MediaRecorder(stream, { mimeType, videoBitsPerSecond: 8_000_000 });
  recChunks = [];
  mediaRecorder.ondataavailable = e => { if (e.data.size > 0) recChunks.push(e.data); };
  mediaRecorder.onstop = saveVideo;
  mediaRecorder.start(100);

  recStart = Date.now();
  recInterval = setInterval(updateRecTimer, 100);

  document.getElementById('btnRecord').classList.add('active');
  document.getElementById('btnRecordLabel').textContent = 'Stop';
  document.getElementById('recTimer').classList.add('show');

  renderRecFrame();
  toast('● Aufnahme läuft…');
}

function renderRecFrame() {
  if (!isRecording) return;

  const stage  = document.getElementById('stage');
  const stRect = stage.getBoundingClientRect();

  recCtx.clearRect(0, 0, recCanvas.width, recCanvas.height);

  // Draw bg canvas
  recCtx.drawImage(canvas, 0, 0, recCanvas.width, recCanvas.height);

  // Draw phone area
  const phoneEl   = document.querySelector('.phone-body');
  const phoneRect = phoneEl.getBoundingClientRect();
  const px = phoneRect.left - stRect.left;
  const py = phoneRect.top  - stRect.top;
  const pw = phoneRect.width;
  const ph = phoneRect.height;

  // Body
  recCtx.save();
  recCtx.beginPath();
  recCtx.roundRect(px, py, pw, ph, 44);
  const bg = recCtx.createLinearGradient(px, py, px+pw, py+ph);
  bg.addColorStop(0, '#2a2a2a'); bg.addColorStop(1, '#1a1a1a');
  recCtx.fillStyle = bg;
  recCtx.shadowColor = 'rgba(0,0,0,.7)';
  recCtx.shadowBlur  = 40;
  recCtx.shadowOffsetY = 20;
  recCtx.fill();
  recCtx.restore();

  // Screen
  recCtx.save();
  recCtx.beginPath();
  recCtx.roundRect(px+9, py+9, pw-18, ph-18, 36);
  recCtx.fillStyle = '#000';
  recCtx.fill();
  if (uploadedImage && recImg) {
    recCtx.save();
    recCtx.beginPath();
    recCtx.roundRect(px+9, py+9, pw-18, ph-18, 36);
    recCtx.clip();
    recCtx.drawImage(recImg, px+9, py+9, pw-18, ph-18);
    recCtx.restore();
  }
  recCtx.restore();

  // Island
  recCtx.save();
  recCtx.fillStyle = '#000';
  recCtx.beginPath();
  recCtx.roundRect(px + pw/2 - 40, py + 13, 80, 24, 13);
  recCtx.fill();
  recCtx.restore();

  requestAnimationFrame(renderRecFrame);
}

// Preload recording image ref
let recImg = null;
document.getElementById('userImg').addEventListener('load', function() {
  recImg = this;
});

function stopRecord() {
  isRecording = false;
  clearInterval(recInterval);
  mediaRecorder.stop();
  document.getElementById('btnRecord').classList.remove('active');
  document.getElementById('btnRecordLabel').textContent = 'Aufnehmen';
  document.getElementById('recTimer').classList.remove('show');
  toast('⏳ Video wird exportiert…');
}

function saveVideo() {
  const blob = new Blob(recChunks, { type: 'video/webm' });
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement('a');
  a.href     = url;
  a.download = 'content-market-promo.webm';
  a.click();
  setTimeout(() => URL.revokeObjectURL(url), 5000);
  toast('✓ Video gespeichert!');
}

function updateRecTimer() {
  const elapsed = Date.now() - recStart;
  const s = Math.floor(elapsed / 1000);
  const m = Math.floor(s / 60);
  document.getElementById('recTime').textContent = m + ':' + String(s % 60).padStart(2,'0');
}

/* ════════════════════════════════════════════════════
   TOAST
   ════════════════════════════════════════════════════ */
let toastTimer;
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2800);
}
</script>
